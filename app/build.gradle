plugins {
    id 'com.android.application'
}

def gitVersionCode() {
    try {
        return "git rev-list --count HEAD".execute(null, rootDir).text.trim().toInteger()
    } catch (Exception ignored) {
        return 1
    }
}

def gitVersionName() {
    try {
        return "git describe --tags --always --dirty".execute(null, rootDir).text.trim() ?: "unknown"
    } catch (Exception ignored) {
        return "unknown"
    }
}

android {
    namespace = 'dk.au.aptg.dEdx'

    signingConfigs {
        release {
            def b64 = System.getenv("KEYSTORE_BASE64")
            if (b64) {
                def ks = file("${buildDir}/keystore.jks")
                ks.parentFile.mkdirs()
                ks.bytes = b64.decodeBase64()
                storeFile = ks
            }
            storePassword = System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias = System.getenv("KEY_ALIAS") ?: "dedx-upload"
            keyPassword = System.getenv("KEYSTORE_PASSWORD") ?: ""
        }
    }
    compileSdk = 34
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "dk.au.aptg.dEdx"
        minSdk = 21
        targetSdk = 34
        versionCode = gitVersionCode()
        versionName = gitVersionName()

        externalNativeBuild {
            cmake {
                cFlags = ["-std=c11"]
                abiFilters = ["arm64-v8a", "armeabi-v7a", "x86_64"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_BASE64")) {
                signingConfig = signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}
